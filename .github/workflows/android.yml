name: Android-App bauen

# Baut die Android-App (Capacitor):
# - ohne Signaturschlüssel nur eine Test-APK (Artefakt „timelytix-apk“, Updates darüber nicht möglich)
# - mit Signaturschlüssel die signierte APK zum Herunterladen (Artefakt „timelytix-apk“) und das
#   App-Paket für den Play Store (Artefakt „timelytix-aab“); auf main wird die APK an das GitHub-Release
#   der Version gehängt (Download-Seite und Update-Suche der App holen sie dort)
# Einrichtung des Schlüssels: docs/android.md
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write # APK an das Release hängen (nur auf main)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
        env:
          TZ: Europe/Berlin
      - run: npm run build
      - run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Timelytix-$(node -p "require('../package.json').version").apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Timelytix-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: timelytix-apk
          path: ${{ runner.temp }}/Timelytix-*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: timelytix-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: APK an das Release hängen
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Das Release legt der Workflow „Versionen auf GitHub anlegen“ an – kurz darauf warten
          for i in $(seq 1 30); do gh release view "v$version" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "v$version" "$RUNNER_TEMP/Timelytix-$version.apk" --clobber

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
