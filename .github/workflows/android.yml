name: Android-App bauen

# Baut die Android-App (Capacitor):
# - ohne Signaturschlüssel nur eine Test-APK (Artefakt „timelytix-apk“, Updates darüber nicht möglich)
# - mit Signaturschlüssel die signierte APK zum Herunterladen (Artefakt „timelytix-apk“) und das
#   App-Paket für den Play Store (Artefakt „timelytix-aab“); auf main wird die APK an das GitHub-Release
#   der Version gehängt (Download-Seite und Update-Suche der App holen sie dort)
# - auf claude/…-Branches (mit Schlüssel) zusätzlich eine Beta als Pre-Release „vX.Y.Z-beta.N“ (N zählt je
#   Version ab 1) – nur Geräte mit „Beta-Versionen testen“ bekommen sie angeboten; ältere Betas werden dabei entfernt
# Einrichtung des Schlüssels: docs/android.md
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write # APK an das Release hängen (main) bzw. Beta veröffentlichen (claude/…)

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
        env:
          TZ: Europe/Berlin

      - name: Beta-Version bestimmen
        if: startsWith(github.ref, 'refs/heads/claude/') && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Version schon veröffentlicht (noch keine neue Nummer gesetzt) → Beta der nächsten Korrektur-Version
          if gh release view "v$version" >/dev/null 2>&1; then
            version=$(node -p "const [a, b, c] = require('./package.json').version.split('.').map(Number); [a, b, c + 1].join('.')")
          fi
          IFS=. read -r major minor patch <<< "$version"
          # Nummer je Version ab 1: eins mehr als die (einzige behaltene) Beta dieser Version
          last=$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            { grep -E "^v${version//./\\.}-beta\.[0-9]+$" || true; } | sed 's/.*-beta\.//' | sort -n | tail -1)
          beta="$version-beta.$(( ${last:-0} + 1 ))"
          {
            echo "BETA_VERSION=$beta"
            echo "APP_VERSION_NAME=$beta"
            echo "APP_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch * 10 - 1))"
            echo "VITE_APP_VERSION=$beta"
          } >> "$GITHUB_ENV"
          echo "Beta: $beta"

      - run: npm run build
      - run: npx cap sync android

      - name: Signaturschlüssel bereitstellen
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Timelytix-${APP_VERSION_NAME:-$(node -p "require('../package.json').version")}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Timelytix-test.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: timelytix-apk
          path: ${{ runner.temp }}/Timelytix-*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_PATH != ''
        with:
          name: timelytix-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: APK an das Release hängen
        if: github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # Das Release legt der Workflow „Versionen auf GitHub anlegen“ an – kurz darauf warten
          for i in $(seq 1 30); do gh release view "v$version" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "v$version" "$RUNNER_TEMP/Timelytix-$version.apk" --clobber
          # Betas sind mit der richtigen Version überholt
          gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep -E -- '-beta\.[0-9]+$' || true; } |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      - name: Beta veröffentlichen
        if: env.BETA_VERSION != '' && env.ANDROID_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versionshinweise wie in „Was ist neu?“: der Eintrag der kommenden Version aus changelog.json (kurz);
          # die App zeigt sie vor der Installation (Zeilen mit „- “, siehe lib/apk-update.ts)
          notes=$(node -e '
            const [beta, date] = process.argv.slice(1);
            const r = require("./src/lib/changelog.json").find((x) => x.version === beta.split("-beta.")[0]);
            const changes = r ? r.changes : ["Fehlerkorrekturen und Verbesserungen"];
            console.log(`**${date}**\n\nBeta zum Testen.\n\n${changes.map((c) => `- ${c}`).join("\n")}`);
          ' "$BETA_VERSION" "$(TZ=Europe/Berlin date +%d.%m.%Y)")
          gh release create "v$BETA_VERSION" "$RUNNER_TEMP/Timelytix-$BETA_VERSION.apk" --target "$GITHUB_SHA" \
            --title "Timelytix $BETA_VERSION (Beta)" --notes "$notes" --prerelease --latest=false
          # Nur die neueste Beta behalten
          gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep -E -- '-beta\.[0-9]+$' || true; } |
            { grep -v -x -F "v$BETA_VERSION" || true; } | while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
